[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "A",   # flake8-builtins
    "UP",  # pyupgrade
    "FA",  # flake8-future-annotations
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
